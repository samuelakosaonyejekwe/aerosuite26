# Rebuilds data/snapshot.json (location-independent live feeds, fetched server-side) every three hours and
# republishes the site with it. Nothing is committed: the snapshot exists only in the published site.
# The site is rebuilt from the last commit that passed "Test and deploy", so an untested commit is never
# published by the schedule; if there is no such run yet, the current commit is tested first.
name: Refresh live-data snapshot
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  last-good:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.find.outputs.sha }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --status success --limit 1 --json headSha --jq '.[0].headSha // ""' || true)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
  publish:
    needs: last-good
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.last-good.outputs.sha }}
      run-tests: ${{ needs.last-good.outputs.sha == '' }}
